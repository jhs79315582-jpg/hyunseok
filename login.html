<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVER 로그인</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1f1f1f;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Malgun Gothic",
                Arial,
                sans-serif;
            min-height: 100vh;
        }

        /* 전체 영역 */
        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 96px;
        }

        /* NAVER 로고 */
        .logo {
            color: #5ac261;
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -3px;
            margin-bottom: 42px;
        }

        /* 로그인 박스 */
        .login-container {
            width: 544px;
            min-height: 480px;
            border: 1px solid #373737;
            border-radius: 20px;
            padding: 50px 55px 42px;
            background: #202020;
        }

        /* 입력 영역 */
        .input-area {
            width: 100%;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 72px;
            border-bottom: 1px solid #4b4b4b;
            margin-bottom: 1px;
        }

        .input-box:first-child {
            border-bottom-color: #5ac261;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            padding: 25px 0 5px;
        }

        .input-box label {
            position: absolute;
            left: 0;
            top: 28px;
            color: #bcbcbc;
            font-size: 15px;
            pointer-events: none;
            transition: 0.2s ease;
        }

        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: 8px;
            font-size: 11px;
            color: #5ac261;
        }

        /* 옵션 영역 */
        .option-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 45px;
            margin-bottom: 15px;
        }

        /* 로그인 상태 유지 */
        .keep-login {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #dddddd;
            font-size: 14px;
            cursor: pointer;
        }

        .keep-login input {
            display: none;
        }

        .check-circle {
            width: 18px;
            height: 18px;
            border: 1.5px solid #8b8b8b;
            border-radius: 50%;
            position: relative;
        }

        .keep-login input:checked + .check-circle {
            border-color: #5ac261;
            background: #5ac261;
        }

        .keep-login input:checked + .check-circle::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 4px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(-45deg);
            left: 4px;
            top: 5px;
        }

        /* IP 보안 */
        .ip-security {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #eeeeee;
            font-size: 14px;
        }

        /* 토글 */
        .toggle {
            width: 42px;
            height: 24px;
            border-radius: 20px;
            background: #5ac261;
            position: relative;
            cursor: pointer;
        }

        .toggle::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            top: 3px;
            right: 3px;
            transition: 0.2s;
        }

        .toggle.off {
            background: #555555;
        }

        .toggle.off::after {
            right: 21px;
        }

        /* 버튼 영역 */
        .button-area {
            display: flex;
            gap: 10px;
        }

        .login-button,
        .easy-login-button {
            height: 51px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .easy-login-button {
            flex: 1;
            background: #292929;
            color: white;
        }

        .easy-login-button:hover {
            background: #333333;
        }

        .login-button {
            flex: 1;
            background: #5ac261;
            color: white;
        }

        .login-button:hover {
            background: #67cf6e;
        }

        /* 간편 로그인 */
        .sub-login {
            display: flex;
            justify-content: center;
            gap: 23px;
            margin-top: 29px;
            font-size: 14px;
        }

        .sub-login a {
            color: #eeeeee;
            text-decoration: none;
        }

        .sub-login a:hover {
            text-decoration: underline;
        }

        /* 하단 메뉴 */
        .bottom-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 28px;
            gap: 10px;
            font-size: 14px;
            color: #aaaaaa;
        }

        .bottom-menu a {
            color: #eeeeee;
            text-decoration: none;
        }

        .bottom-menu a:hover {
            text-decoration: underline;
        }

        .bottom-menu .join {
            color: #5ac261;
        }

        .divider {
            color: #555555;
        }

        /* 광고 */
        .ad {
            width: 480px;
            height: 120px;
            margin-top: 40px;
            background:
                linear-gradient(
                    90deg,
                    #6c170d 0%,
                    #8c2918 50%,
                    #5b130c 100%
                );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ad-content {
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ad-text {
            color: #fff8df;
        }

        .ad-small {
            font-size: 11px;
            margin-bottom: 3px;
        }

        .ad-title {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .ad-description {
            font-size: 12px;
            margin-top: 4px;
        }

        .ad-percent {
            font-size: 48px;
            font-weight: 900;
            color: #f5e4c4;
        }

        /* 반응형 */
        @media (max-width: 650px) {

            .login-page {
                padding-top: 50px;
            }

            .logo {
                font-size: 38px;
                margin-bottom: 30px;
            }

            .login-container {
                width: calc(100% - 30px);
                padding: 40px 30px;
            }

            .ad {
                width: calc(100% - 30px);
            }

            .option-area {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <!-- NAVER 로고 -->
        <div class="logo">
            NAVER
        </div>

        <!-- 로그인 박스 -->
        <section class="login-container">

            <!-- 아이디 / 비밀번호 -->
            <div class="input-area">

                <div class="input-box">
                    <input
                        type="text"
                        id="userId"
                        placeholder=" "
                        autocomplete="username"
                    >
                    <label for="userId">
                        아이디 또는 전화번호
                    </label>
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        id="password"
                        placeholder=" "
                        autocomplete="current-password"
                    >
                    <label for="password">
                        비밀번호
                    </label>
                </div>

            </div>

            <!-- 옵션 -->
            <div class="option-area">

                <label class="keep-login">
                    <input type="checkbox" checked>
                    <span class="check-circle"></span>
                    로그인 상태 유지
                </label>

                <div class="ip-security">
                    <span>IP 보안</span>
                    <div
                        class="toggle"
                        id="ipToggle"
                        onclick="toggleIP()"
                    ></div>
                </div>

            </div>

            <!-- 버튼 -->
            <div class="button-area">

                <button
                    class="easy-login-button"
                    onclick="easyLogin()"
                >
                    👥 패스키 로그인
                </button>

                <button
                    class="login-button"
                    onclick="login()"
                >
                    로그인
                </button>

            </div>

            <!-- 다른 로그인 방식 -->
            <div class="sub-login">

                <a href="#" onclick="qrLogin()">
                    QR코드 로그인
                </a>

                <a href="#" onclick="numberLogin()">
                    일회용 번호 로그인
                </a>

            </div>

        </section>

        <!-- 하단 메뉴 -->
        <nav class="bottom-menu">

            <a href="#">
                아이디 찾기
            </a>

            <span class="divider">|</span>

            <a href="#">
                비밀번호 찾기
            </a>

            <span class="divider">|</span>

            <a href="#" class="join">
                회원가입
            </a>

        </nav>

        <!-- 광고 -->
        <div class="ad">

            <div class="ad-content">

                <div class="ad-text">

                    <div class="ad-small">
                        N + 멤버십
                    </div>

                    <div class="ad-title">
                        멤버십데이
                    </div>

                    <div class="ad-description">
                        가을 쇼핑 끝판왕 등장!
                    </div>

                </div>

                <div class="ad-percent">
                    3%
                </div>

            </div>

        </div>

    </main>


    <script>

        // IP 보안 토글
        function toggleIP() {

            const toggle = document.getElementById("ipToggle");

            toggle.classList.toggle("off");

        }


        // 로그인
        function login() {

            const id = document.getElementById("userId").value;
            const password = document.getElementById("password").value;

            if (id.trim() === "") {

                alert("아이디 또는 전화번호를 입력해주세요.");
                document.getElementById("userId").focus();

                return;
            }

            if (password.trim() === "") {

                alert("비밀번호를 입력해주세요.");
                document.getElementById("password").focus();

                return;
            }

            alert("로그인 버튼이 눌렸습니다.");

        }


        // 패스키 로그인
        function easyLogin() {

            alert("패스키 로그인을 선택했습니다.");

        }


        // QR 로그인
        function qrLogin() {

            alert("QR코드 로그인을 선택했습니다.");

        }


        // 일회용 번호 로그인
        function numberLogin() {

            alert("일회용 번호 로그인을 선택했습니다.");

        }

    </script>

</body>
</html>
